<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gallery | Amma Bhavani Youth Association</title>

    <link rel="stylesheet" href="style.css">

    <style>

        /* ================= GALLERY PAGE ================= */

        .gallery-page {
            min-height: 100vh;
            background: #fff8ed;
        }

        /* HERO */

        .gallery-hero {
            min-height: 40vh;

            display: flex;
            align-items: center;
            justify-content: center;

            text-align: center;

            padding: 60px 20px;

            background:
                linear-gradient(
                    rgba(100, 0, 0, 0.80),
                    rgba(50, 0, 0, 0.85)
                ),
                url("Durga-image.jpg");

            background-size: cover;
            background-position: center;
        }

        .gallery-hero h1 {
            color: #ffd700;
            font-size: 48px;
            margin: 10px 0;
        }

        .gallery-hero p {
            color: white;
            font-size: 18px;
        }


        /* GALLERY CONTENT */

        .gallery-content {
            max-width: 1100px;
            margin: auto;

            padding: 60px 20px;

            text-align: center;
        }

        .gallery-content h2 {
            color: #9b0000;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .gallery-intro {
            color: #555;
            margin-bottom: 35px;
        }


        /* PHOTO GRID */

        .gallery-container {
            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 25px;
        }

        .gallery-item {
            aspect-ratio: 1 / 1;

            overflow: hidden;

            border-radius: 18px;

            border: 3px solid #d4a017;

            background: white;

            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);

            cursor: pointer;
        }
